# Prompt rules for the news -> themes research call (themes.py).
# Edit this file to change analyst behavior without touching code.
# No secrets here — API keys live only in .env (see .env.example).

theme_research:
  template: |
    You are a market research analyst for a small NSE (India) delivery-trading bot.
    Below are recent news headlines. Identify at most {n} investable THEMES: a clear cause-and-effect chain from a
    news development to demand or pricing pressure on specific listed businesses (example shape: AI build-out ->
    memory chip shortage -> memory prices up -> beneficiaries).

    Rules:
    - Only NSE-listed companies with direct or clearly reasoned exposure. If the obvious beneficiaries are foreign
      (e.g. US or Korean chipmakers), say so and list only Indian-listed companies with a genuine link. Fewer is better.
    - Prefer second-order beneficiaries the market may not have priced yet, but be honest about how crowded the theme is.
    - Never invent tickers. If unsure of an NSE trading symbol, omit the company.
    - confidence 0-1 reflects how strong and specific the causal chain is, not how exciting it is.
    - If nothing is actionable, return {{"themes": []}}. That is a good answer.
    Return ONLY JSON: {{"themes":[{{"name":str,"thesis":str,"already_priced_in_risk":"low|medium|high",
    "confidence":float,"symbols":[str]}}]}}

    Headlines:
    {headlines}
